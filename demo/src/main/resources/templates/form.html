<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ご飯どこ行こっかな？ - 条件入力</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <h1>今日のご飯はどこにする？</h1>
        
        <h2>ルーレットの条件を決めよう！</h2>
        
        <!-- エラーメッセージ表示 -->
        <div class="error-message" th:if="${nullMes}" th:text="${nullMes}"></div>
        
        <form method="post" th:action="@{/RouletteDinner_res}">
            
            <!-- 都道府県 -->
            <div class="form-group">
                <label for="pref">都道府県 <span style="color:#D32F2F;">*必須</span></label>
                <select id="pref" name="pref">
                    <option value="">-- 選択してください --</option>
                    <option value="北海道">北海道</option>
                    <option value="青森">青森県</option>
                    <option value="秋田">秋田県</option>
                    <option value="岩手">岩手県</option>
                    <option value="山形">山形県</option>
                    <option value="宮城">宮城県</option>
                    <option value="福島">福島県</option>
                    <option value="東京">東京都</option>
                    <option value="千葉">千葉県</option>
                    <option value="神奈川">神奈川県</option>
                    <option value="埼玉">埼玉県</option>
                    <option value="群馬">群馬県</option>
                    <option value="栃木">栃木県</option>
                    <option value="茨城">茨城県</option>
                    <option value="山梨">山梨県</option>
                    <option value="静岡">静岡県</option>
                    <option value="愛知">愛知県</option>
                    <option value="長野">長野県</option>
                    <option value="岐阜">岐阜県</option>
                    <option value="新潟">新潟県</option>
                    <option value="富山">富山県</option>
                    <option value="石川">石川県</option>
                    <option value="福井">福井県</option>
                    <option value="大阪">大阪府</option>
                    <option value="京都">京都府</option>
                    <option value="兵庫">兵庫県</option>
                    <option value="和歌山">和歌山県</option>
                    <option value="奈良">奈良県</option>
                    <option value="三重">三重県</option>
                    <option value="滋賀">滋賀県</option>
                    <option value="岡山">岡山県</option>
                    <option value="広島">広島県</option>
                    <option value="山口">山口県</option>
                    <option value="鳥取">鳥取県</option>
                    <option value="島根">島根県</option>
                    <option value="愛媛">愛媛県</option>
                    <option value="香川">香川県</option>
                    <option value="高知">高知県</option>
                    <option value="徳島">徳島県</option>
                    <option value="福岡">福岡県</option>
                    <option value="佐賀">佐賀県</option>
                    <option value="長崎">長崎県</option>
                    <option value="大分">大分県</option>
                    <option value="熊本">熊本県</option>
                    <option value="宮崎">宮崎県</option>
                    <option value="鹿児島">鹿児島県</option>
                    <option value="沖縄">沖縄県</option>
                </select>
            </div>
            
            <!-- キーワード/市区町村 -->
            <div class="form-group">
                <label for="area">フリーワード / 市区町村など</label>
                <input type="text" id="area" name="area" placeholder="例: 渋谷、ラーメン、個室など">
            </div>

            <!-- ジャンル -->
            <div class="form-group">
                <label for="genre">料理ジャンル</label>
                <select id="genre" name="genre">
                    <option value="">指定なし</option>
                    <option value="G001">居酒屋</option>
                    <option value="G002">ダイニングバー・バル</option>
                    <option value="G004">和食</option>
                    <option value="G005">洋食</option>
                    <option value="G006">イタリアン・フレンチ</option>
                    <option value="G007">中華</option>
                    <option value="G008">焼肉・ホルモン</option>
                    <option value="G013">ラーメン</option>
                    <option value="G014">カフェ・スイーツ</option>
                    <option value="G017">お好み焼き・もんじゃ</option>
                </select>
            </div>

            <!-- 予算 -->
            <div class="form-group">
                <label for="budget">ご予算 (目安)</label>
                <select id="budget" name="budget">
                    <option value="">指定なし</option>
                    <option value="B001">～1,500円程度</option>
                    <option value="B002">1,501～2,000円程度</option>
                    <option value="B003">2,001～3,000円程度</option>
                    <option value="B008">3,001～4,000円程度</option>
                    <option value="B004">5,001～7,000円程度</option>
                </select>
            </div>

            <!-- こだわり条件 -->
            <div class="form-group">
                <label>こだわり条件</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="midnight" value="1"> 深夜営業あり
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="nonSmoking" value="1"> 禁煙席あり
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="parking" value="1"> 駐車場あり
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="privateRoom" value="1"> 個室あり
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="wifi" value="1"> WiFiあり
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="child" value="1"> お子様連れ歓迎
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="card" value="1"> カード利用可
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="lunch" value="1"> ランチあり
                    </label>
                </div>
            </div>
            
            <input type="submit" class="btn" value="ルーレットスタート！">
        </form>
        
        <div class="api-logo">
            <a href="http://webservice.recruit.co.jp/">
                <img src="http://webservice.recruit.co.jp/banner/hotpepper-s.gif" alt="ホットペッパーグルメ Webサービス" width="135" height="17" border="0" title="ホットペッパーグルメ Webサービス">
            </a>
        </div>
    </div>
</body>

</html>
